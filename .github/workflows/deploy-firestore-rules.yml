# Publica regras (e índices, se definidos) no Firestore.
#
# Configuração no GitHub → Settings → Secrets and variables → Actions:
#   FIREBASE_TOKEN        — gerar na sua máquina: `firebase login:ci` (token começa por ci_...)
#   FIREBASE_PROJECT_ID   — ID do projeto (ex.: fitmanager-xxxxx)
#
# Executar: Actions → "Deploy Firestore rules" → Run workflow

name: Deploy Firestore rules

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules & indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "${FIREBASE_TOKEN}" ] || [ -z "${FIREBASE_PROJECT_ID}" ]; then
            echo "::error::Defina os secrets FIREBASE_TOKEN e FIREBASE_PROJECT_ID neste repositório (ver comentário no topo do workflow)."
            exit 1
          fi
          firebase deploy --only firestore --project "${FIREBASE_PROJECT_ID}" --token "${FIREBASE_TOKEN}" --non-interactive
