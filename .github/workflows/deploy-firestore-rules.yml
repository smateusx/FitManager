# Manual: publica Firestore (rules + indexes) e Storage (rules) com token CI.
# Secrets no repo → Settings → Secrets and variables → Actions:
#   FIREBASE_TOKEN         (npx firebase-tools login:ci na tua máquina)
#   FIREBASE_PROJECT_ID    (ex.: fitmanager-prod)
#
# Actions → "Deploy Firestore & Storage rules" → Run workflow

name: Deploy Firestore & Storage rules

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore and Storage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "${FIREBASE_TOKEN}" ] || [ -z "${FIREBASE_PROJECT_ID}" ]; then
            echo "::error::Configure FIREBASE_TOKEN e FIREBASE_PROJECT_ID nos secrets do repositório."
            exit 1
          fi
          firebase deploy --only firestore,storage --project "${FIREBASE_PROJECT_ID}" --token "${FIREBASE_TOKEN}" --non-interactive
