name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment target for deployment"
        required: true
        type: choice
        options:
          - staging
          - production
      deploy_command:
        description: "Optional deploy command (e.g. npm run deploy:prod)"
        required: false
        type: string
      backend_health_url:
        description: "Backend health URL (e.g. https://api.example.com/health)"
        required: true
        type: string
      frontend_url:
        description: "Optional frontend URL to validate (e.g. https://app.example.com)"
        required: false
        type: string
      timeout_seconds:
        description: "Timeout for health checks in seconds"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Frontend install
        run: npm ci
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"

      - name: Backend install
        run: npm ci
        working-directory: backend

      - name: Backend check
        run: npm run check
        working-directory: backend

  deploy-and-smoke:
    name: Deploy and smoke check
    runs-on: ubuntu-latest
    needs: quality-gate
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute deploy command
        if: ${{ inputs.deploy_command != '' }}
        run: ${{ inputs.deploy_command }}
        shell: bash

      - name: Skip deploy command
        if: ${{ inputs.deploy_command == '' }}
        run: echo "No deploy command provided. Running smoke checks only."

      - name: Smoke check backend health endpoint
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time "${{ inputs.timeout_seconds }}" "${{ inputs.backend_health_url }}")"
          node -e "const p=JSON.parse(process.argv[1]); if(p.status!=='ok'){console.error('Unexpected backend status:',p); process.exit(1)}" "$response"
          echo "Backend healthcheck passed."

      - name: Smoke check frontend URL
        if: ${{ inputs.frontend_url != '' }}
        run: |
          set -euo pipefail
          curl -fsSIL --max-time "${{ inputs.timeout_seconds }}" "${{ inputs.frontend_url }}" >/dev/null
          echo "Frontend smoke check passed."
